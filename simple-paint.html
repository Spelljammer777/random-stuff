    <script>
    // Get Canvas and Context
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

// Get UI Elements
const toolbar = document.querySelector('.toolbar');
const colorPicker = document.getElementById('colorPicker');
const sizeSlider = document.getElementById('sizeSlider');
const sizeValue = document.getElementById('sizeValue');
const sizeLabel = document.getElementById('sizeLabel');
const sizeIcon = document.getElementById('sizeIcon');
const sizeUnit = document.getElementById('sizeUnit');
const fontSelector = document.getElementById('fontSelector');
const fileLoader = document.getElementById('fileLoader');
const saveBtn = document.getElementById('saveBtn');
const clearBtn = document.getElementById('clearBtn');
const fillBtn = document.getElementById('fillBtn');
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');
const lineBtn = document.getElementById('lineBtn');
const textBtn = document.getElementById('textBtn');

// State Variables
let isDrawing = false;
let currentTool = 'pen';
let currentColor = '#000000';
let currentSize = 5;
let currentFontSize = 16;
let currentFont = 'Arial';
let startX, startY;
let snapshot;
let lastX, lastY;

// Text Tool Specific State
let isMovingText = false;
let textToMove = {
    content: null,
    font: null,
    size: null,
    color: null,
    x: 0, y: 0
};

// --- History Management ---
const MAX_HISTORY_STATES = 20;
let history = [];
let historyIndex = -1;

function saveState() {
    if (historyIndex < history.length - 1) {
        history = history.slice(0, historyIndex + 1);
    }
    if (history.length >= MAX_HISTORY_STATES) {
        history.shift();
    } else {
        historyIndex++;
    }
    try {
      const currentState = ctx.getImageData(0, 0, canvas.width, canvas.height);
      history.push(currentState);
    } catch (err) {
        console.error("Error saving state (getImageData):", err);
        if(historyIndex > -1) historyIndex--;
        updateHistoryButtons();
        return;
    }
    if (history.length === MAX_HISTORY_STATES && historyIndex < MAX_HISTORY_STATES -1) {
        historyIndex = MAX_HISTORY_STATES - 1;
    }
    updateHistoryButtons();
}

function restoreState(index) {
    if (index < 0 || index >= history.length) return;
    try {
        const imageData = history[index];
        ctx.putImageData(imageData, 0, 0);
    } catch(err) {
        console.error("Error restoring state:", err);
    }
}

function undo() {
    if (isMovingText) {
         cancelTextMove();
         return;
    }
    if (historyIndex > 0) {
        historyIndex--;
        restoreState(historyIndex);
        updateHistoryButtons();
    }
}

function redo() {
    if (isMovingText) return;
    if (historyIndex < history.length - 1) {
        historyIndex++;
        restoreState(historyIndex);
        updateHistoryButtons();
    }
}

function updateHistoryButtons() {
    undoBtn.disabled = historyIndex <= 0 && !isMovingText;
    redoBtn.disabled = isMovingText || historyIndex >= history.length - 1;
}

function cancelTextMove(placeText = false, placeX = 0, placeY = 0) {
    if (!isMovingText) return;
    const wasMoving = isMovingText;
    isMovingText = false;
    if(placeText && textToMove.content) {
        restoreState(historyIndex);
        ctx.fillStyle = textToMove.color;
        ctx.font = `${textToMove.size}px ${textToMove.font}`;
        ctx.textBaseline = 'top';
        ctx.fillText(textToMove.content, placeX, placeY);
        try {
            const finalState = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (historyIndex > -1) {
                 history[historyIndex] = finalState;
            } else {
                 history.push(finalState);
                 historyIndex = history.length - 1;
            }
        } catch (err) {
             console.error("Error saving final text state during cancel:", err);
        }
    } else {
         restoreState(historyIndex);
    }
    textToMove.content = null; textToMove.font = null; textToMove.size = null; textToMove.color = null;
    if (wasMoving) updateHistoryButtons();
    canvas.style.cursor = currentTool === 'eraser' ? 'cell' :
                           currentTool === 'fill' ? 'copy' :
                           currentTool === 'text' ? 'text' : 'crosshair';
}

// --- Helper Functions ---
function hexToRgba(hex) {
    if (!hex) return null;
    const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
    hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16), a: 255 } : null;
}
function getPixelColor(imageData, x, y) {
    if (x < 0 || y < 0 || x >= imageData.width || y >= imageData.height) { return null; }
    const index = (y * imageData.width + x) * 4;
    return { r: imageData.data[index], g: imageData.data[index + 1], b: imageData.data[index + 2], a: imageData.data[index + 3] };
}
function colorsMatch(color1, color2, tolerance = 10) {
    if (!color1 || !color2) return false;
    if (color1.a !== color2.a) return false;
    const diffR = Math.abs(color1.r - color2.r);
    const diffG = Math.abs(color1.g - color2.g);
    const diffB = Math.abs(color1.b - color2.b);
    return (diffR + diffG + diffB) <= tolerance;
}

// --- Flood Fill Implementation ---
function floodFill(startX, startY, fillColorRgba, tolerance = 30) {
    if (isMovingText) cancelTextMove(true, textToMove.x, textToMove.y);
    let imageData; try { imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); } catch (err) { console.error("Fill Error:", err); alert("Fill failed: " + err.message); return; }
    const originalStartColor = getPixelColor(imageData, startX, startY);
    const targetColor = fillColorRgba;
    if (!originalStartColor || !targetColor || colorsMatch(originalStartColor, targetColor, tolerance)) { return; }
    const queue = [[startX, startY]]; const processed = new Set(); processed.add(`${startX},${startY}`); let iterations = 0; const maxIterations = canvas.width * canvas.height;
    while (queue.length > 0) {
        iterations++; if (iterations > maxIterations) { console.error("Fill iteration limit!"); break; }
        const [x, y] = queue.shift(); const index = (y * imageData.width + x) * 4;
        imageData.data[index] = targetColor.r; imageData.data[index + 1] = targetColor.g; imageData.data[index + 2] = targetColor.b; imageData.data[index + 3] = targetColor.a;
        const neighbors = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
        for (const [nx, ny] of neighbors) {
            const neighborKey = `${nx},${ny}`;
            if (nx >= 0 && nx < imageData.width && ny >= 0 && ny < imageData.height && !processed.has(neighborKey)) {
                const neighborColor = getPixelColor(imageData, nx, ny);
                if (neighborColor && colorsMatch(neighborColor, originalStartColor, tolerance)) { queue.push([nx, ny]); }
                 processed.add(neighborKey);
            }
        }
    }
    ctx.putImageData(imageData, 0, 0);
    saveState();
}

// --- Canvas Setup ---
function setCanvasSize() {
    if (isMovingText) cancelTextMove(true, textToMove.x, textToMove.y);
    const style = getComputedStyle(canvas);
    const width = parseInt(style.width, 10);
    const height = parseInt(style.height, 10);
    canvas.width = width; canvas.height = height;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = currentColor; ctx.fillStyle = currentColor;
    ctx.lineWidth = currentSize; ctx.font = `${currentFontSize}px ${currentFont}`;
    if (history.length > 0 && historyIndex >= 0) { restoreState(historyIndex); }
}

window.addEventListener('load', () => {
    canvas.style.height = `${window.innerHeight * 0.7}px`;
    setCanvasSize();
    ctx.strokeStyle = currentColor; ctx.fillStyle = currentColor;
    ctx.lineWidth = currentSize; ctx.font = `${currentFontSize}px ${currentFont}`;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    sizeSlider.value = currentSize;
    sizeValue.textContent = currentSize;
    fontSelector.style.display = 'none';
    sizeUnit.style.display = 'none';
    saveState();
    updateHistoryButtons();
});

window.addEventListener('resize', () => {
     canvas.style.height = `${window.innerHeight * 0.7}px`;
     setCanvasSize();
});

// --- Tool Selection ---
toolbar.addEventListener('click', (e) => {
    const button = e.target.closest('.tool[data-tool]');
    if (button) {
        const newTool = button.getAttribute('data-tool');
        if (isMovingText && currentTool === 'text' && newTool !== 'text') {
             cancelTextMove(true, textToMove.x, textToMove.y);
        } else if (isMovingText && newTool !== 'text') {
             cancelTextMove(false);
        }
        document.querySelectorAll('.tool').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        currentTool = newTool;
        canvas.style.cursor = currentTool === 'eraser' ? 'cell' :
                              currentTool === 'fill' ? 'copy' :
                              currentTool === 'text' ? 'text' : 'crosshair';
        if (currentTool === 'text') {
            sizeLabel.textContent = 'Font Size:';
            sizeIcon.className = 'fas fa-text-height icon-label';
            sizeSlider.min = 8; sizeSlider.max = 120;
            sizeSlider.value = currentFontSize; sizeValue.textContent = currentFontSize;
            fontSelector.style.display = 'inline-block';
            sizeUnit.style.display = 'inline-block';
        } else {
            sizeLabel.textContent = 'Size:';
            sizeIcon.className = 'fas fa-sliders-h icon-label';
            sizeSlider.min = 1; sizeSlider.max = 50;
            sizeSlider.value = currentSize; sizeValue.textContent = currentSize;
            fontSelector.style.display = 'none';
            sizeUnit.style.display = 'none';
        }
        updateHistoryButtons();
    }
});

// --- Font Selection ---
fontSelector.addEventListener('input', (e) => {
    currentFont = e.target.value;
    if (currentTool === 'text') { ctx.font = `${currentFontSize}px ${currentFont}`; }
    if (isMovingText) { textToMove.font = currentFont; }
});

// --- Color and Size Selection ---
colorPicker.addEventListener('input', (e) => {
    currentColor = e.target.value;
    ctx.strokeStyle = currentColor; ctx.fillStyle = currentColor;
     if (isMovingText) { textToMove.color = currentColor; }
});

sizeSlider.addEventListener('input', (e) => {
    const value = e.target.value;
    sizeValue.textContent = value;
    if (currentTool === 'text') {
        currentFontSize = value;
        ctx.font = `${currentFontSize}px ${currentFont}`;
        if (isMovingText) { textToMove.size = currentFontSize; }
    } else {
        currentSize = value;
        ctx.lineWidth = currentSize;
    }
});

// --- Drawing Logic ---
// *** UPDATED to handle touch events ***
function getMousePos(evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let clientX, clientY;

    if (evt.touches && evt.touches.length > 0) {
      // Touch event
      clientX = evt.touches[0].clientX;
      clientY = evt.touches[0].clientY;
    } else {
      // Mouse event
      clientX = evt.clientX;
      clientY = evt.clientY;
    }

    return {
        x: Math.floor((clientX - rect.left) * scaleX),
        y: Math.floor((clientY - rect.top) * scaleY)
    };
}

function handleMouseDown(e) {
    // Prevent default actions for touch events that might cause scrolling/zooming
    if (e.type === 'touchstart') {
        e.preventDefault();
    }
    const pos = getMousePos(e);

    if (currentTool === 'text') {
        if (isMovingText) {
            isDrawing = false;
            restoreState(historyIndex);
            ctx.fillStyle = textToMove.color;
            ctx.font = `${textToMove.size}px ${textToMove.font}`;
            ctx.textBaseline = 'top';
            ctx.fillText(textToMove.content, pos.x, pos.y);
             try {
                 const finalState = ctx.getImageData(0, 0, canvas.width, canvas.height);
                 history[historyIndex] = finalState;
             } catch (err) {
                 console.error("Error saving final text state:", err);
             }
            isMovingText = false;
            textToMove.content = null;
            updateHistoryButtons();
            canvas.style.cursor = 'text';
        } else {
            const textToDraw = prompt("Enter text:", "");
            if (textToDraw) {
                textToMove.content = textToDraw;
                textToMove.font = currentFont;
                textToMove.size = currentFontSize;
                textToMove.color = currentColor;
                textToMove.x = pos.x;
                textToMove.y = pos.y;
                ctx.fillStyle = currentColor;
                ctx.font = `${currentFontSize}px ${currentFont}`;
                ctx.textBaseline = 'top';
                ctx.fillText(textToDraw, pos.x, pos.y);
                saveState();
                if (historyIndex > 0) {
                     historyIndex--;
                     restoreState(historyIndex);
                     isMovingText = true;
                     canvas.style.cursor = 'move';
                     updateHistoryButtons();
                } else {
                    console.warn("Cannot initiate text move - no previous state.");
                    isMovingText = false;
                    textToMove.content = null;
                }
            }
        }
        return;
    }

    if (currentTool === 'fill') {
        if (isMovingText) cancelTextMove(true, textToMove.x, textToMove.y);
        const fillColorRgba = hexToRgba(currentColor);
        if (fillColorRgba) { floodFill(pos.x, pos.y, fillColorRgba, 30); }
        return;
    }

     if (isMovingText) cancelTextMove(true, textToMove.x, textToMove.y);

    isDrawing = true;
    startX = pos.x; startY = pos.y;
    lastX = startX; lastY = startY;
    ctx.lineWidth = currentSize;
    ctx.strokeStyle = (currentTool === 'eraser') ? '#ffffff' : currentColor;
    ctx.fillStyle = currentColor;
    ctx.lineCap = (currentTool === 'pen' || currentTool === 'eraser') ? 'round' : 'butt';
    ctx.lineJoin = (currentTool === 'pen' || currentTool === 'eraser') ? 'round' : 'miter';

    if (['line', 'rectangle', 'triangle', 'circle'].includes(currentTool)) {
      try { snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height); }
      catch (err) { console.error("Snapshot Error:", err); snapshot = null; }
    }
    ctx.beginPath(); ctx.moveTo(startX, startY);
    if (currentTool === 'pen' || currentTool === 'eraser') {
        ctx.lineTo(startX + 0.1, startY + 0.1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(startX, startY);
    }
}

function handleMouseMove(e) {
    // Prevent default actions for touch events that might cause scrolling/zooming
     if (e.type === 'touchmove') {
        e.preventDefault();
    }

    if (currentTool === 'text' && isMovingText) {
        const pos = getMousePos(e);
        textToMove.x = pos.x;
        textToMove.y = pos.y;
        restoreState(historyIndex);
        ctx.fillStyle = textToMove.color;
        ctx.font = `${textToMove.size}px ${textToMove.font}`;
        ctx.textBaseline = 'top';
        ctx.fillText(textToMove.content, pos.x, pos.y);
        return;
    }

    if (currentTool === 'fill' || !isDrawing) return;

    const pos = getMousePos(e);
    const currentX = pos.x; const currentY = pos.y;

    if (['line', 'rectangle', 'triangle', 'circle'].includes(currentTool) && snapshot) {
       try { ctx.putImageData(snapshot, 0, 0); } catch (err) { console.error("Snapshot put Error:", err); }
    }

    ctx.lineWidth = currentSize;
    ctx.strokeStyle = (currentTool === 'eraser') ? '#ffffff' : currentColor;
    ctx.fillStyle = currentColor;
    ctx.lineCap = (currentTool === 'pen' || currentTool === 'eraser') ? 'round' : 'butt';
    ctx.lineJoin = (currentTool === 'pen' || currentTool === 'eraser') ? 'round' : 'miter';

    switch (currentTool) {
        case 'pen': case 'eraser':
            ctx.lineTo(currentX, currentY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(currentX, currentY);
            break;
        case 'line':
            ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(currentX, currentY); ctx.stroke();
            break;
        case 'rectangle':
            ctx.beginPath(); ctx.rect(startX, startY, currentX - startX, currentY - startY); ctx.stroke();
            break;
        case 'triangle':
            ctx.beginPath(); ctx.moveTo(startX + (currentX - startX) / 2, startY);
            ctx.lineTo(startX, currentY); ctx.lineTo(currentX, currentY); ctx.closePath(); ctx.stroke();
            break;
        case 'circle':
            ctx.beginPath(); const dx = currentX - startX; const dy = currentY - startY;
            const radius = Math.max(0, Math.sqrt(dx*dx + dy*dy) / 2);
            const centerX = startX + dx / 2; const centerY = startY + dy / 2;
            if (radius > 0) { ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI); ctx.stroke(); }
            break;
    }
    lastX = currentX; lastY = currentY;
}

function handleMouseUp(e) {
     // Prevent default actions for touch events
     if (e.type === 'touchend' || e.type === 'touchcancel') {
        // e.preventDefault(); // Usually not needed for touchend/cancel
    }

     if (currentTool === 'fill' || currentTool === 'text') {
         if (isDrawing) {
             isDrawing = false;
             if (snapshot) {
                  restoreState(historyIndex);
                  snapshot = null;
             }
             console.log("Drawing cancelled due to tool switch mid-drag.");
         }
         return;
     }

    if (isDrawing) {
        isDrawing = false;
        if (['line', 'rectangle', 'triangle', 'circle'].includes(currentTool) && snapshot) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            // For mouseup/touchend, use changedTouches if available
            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            const finalX = Math.floor((clientX - rect.left) * scaleX);
            const finalY = Math.floor((clientY - rect.top) * scaleY);
            const tempLastX = lastX;
            const tempLastY = lastY;
            lastX = finalX; // Use final position for the redraw
            lastY = finalY;
            // Simulate one last move event at the final position for redraw
            handleMouseMove({ clientX: clientX, clientY: clientY, type: 'mousemove' }); // Pass a basic object
            lastX = tempLastX; // Restore original lastX/Y if needed elsewhere
            lastY = tempLastY;
            snapshot = null;
        }
        ctx.closePath();
        saveState();
    }
}

// --- Attach Event Listeners ---
// Mouse Events
canvas.addEventListener('mousedown', handleMouseDown);
canvas.addEventListener('mousemove', handleMouseMove);
canvas.addEventListener('mouseup', handleMouseUp);
canvas.addEventListener('mouseout', handleMouseUp); // Treat mouseout like mouseup

// Touch Events
canvas.addEventListener('touchstart', handleMouseDown, { passive: false }); // Use passive: false to allow preventDefault
canvas.addEventListener('touchmove', handleMouseMove, { passive: false });
canvas.addEventListener('touchend', handleMouseUp);
canvas.addEventListener('touchcancel', handleMouseUp); // Treat cancel like mouseup

// Other UI Listeners
undoBtn.addEventListener('click', undo);
redoBtn.addEventListener('click', redo);

// --- File Handling ---
fileLoader.addEventListener('change', (e) => {
    if (isMovingText) cancelTextMove(true, textToMove.x, textToMove.y);
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const hRatio = canvas.width / img.width; const vRatio = canvas.height / img.height;
            const ratio = Math.min(hRatio, vRatio, 1);
            const centerShift_x = (canvas.width - img.width * ratio) / 2;
            const centerShift_y = (canvas.height - img.height * ratio) / 2;
            ctx.drawImage(img, 0, 0, img.width, img.height, centerShift_x, centerShift_y, img.width * ratio, img.height * ratio);
            saveState();
        }
        img.src = event.target.result;
    }
    reader.readAsDataURL(file);
    e.target.value = null;
});

saveBtn.addEventListener('click', () => {
    if (isMovingText) cancelTextMove(true, textToMove.x, textToMove.y);
    const filename = prompt("Save as:", "painting.png");
    if (!filename) return;
    let mimeType = 'image/png';
    if (filename.toLowerCase().endsWith('.jpg') || filename.toLowerCase().endsWith('.jpeg')) {
        mimeType = 'image/jpeg';
    }
    let dataURL;
    if (mimeType === 'image/jpeg') {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.fillStyle = '#ffffff';
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        tempCtx.drawImage(canvas, 0, 0);
        dataURL = tempCanvas.toDataURL(mimeType, 0.9);
    } else {
        dataURL = canvas.toDataURL(mimeType);
    }
    const link = document.createElement('a');
    link.download = filename;
    link.href = dataURL;
    link.click();
});

// --- Clear Canvas ---
clearBtn.addEventListener('click', () => {
    if (isMovingText) cancelTextMove(false);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    saveState();
});

    </script>
</body>
